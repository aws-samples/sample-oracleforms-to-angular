<div class="orders-form">
  <div class="orders-header">
    <h2>Orders</h2>
  </div>

  <div class="orders-master">
    <div class="field-row">
      <label for="orderId">Order ID</label>
      <input id="orderId" type="text" [value]="currentOrder?.orderId" readonly />
    </div>

    <div class="field-row">
      <label for="orderData">Order Date</label>
      <input id="orderData" type="date" [(ngModel)]="currentOrder.orderData" name="orderData" />
    </div>

    <div class="field-row">
      <label for="customerId">Customer ID</label>
      <input id="customerId" type="number" [(ngModel)]="currentOrder.customerId" name="customerId" />
    </div>

    <div class="field-row">
      <label for="employeeId">Employee ID</label>
      <input id="employeeId" type="number" [(ngModel)]="currentOrder.employeeId" name="employeeId" />
    </div>

    <div class="field-row">
      <label for="totalAmount">Total Amount</label>
      <input id="totalAmount" type="number" step="0.01" [(ngModel)]="currentOrder.totalAmount" name="totalAmount" />
    </div>

    <div class="field-row">
      <label for="tableNumber">Table Number</label>
      <input id="tableNumber" type="number" [(ngModel)]="currentOrder.tableNumber" name="tableNumber" />
    </div>

    <div class="field-row">
      <label for="orderType">Order Type</label>
      <input id="orderType" type="text" maxlength="50" [(ngModel)]="currentOrder.orderType" name="orderType" />
    </div>

    <div class="field-row">
      <label for="discount">Discount</label>
      <input id="discount" type="number" step="0.01" [(ngModel)]="currentOrder.discount" name="discount" />
    </div>

    <div class="field-row">
      <label for="finalAmount">Final Amount</label>
      <input id="finalAmount" type="number" step="0.01" [(ngModel)]="currentOrder.finalAmount" name="finalAmount" />
    </div>

    <div class="field-row">
      <label for="statues">Status</label>
      <input id="statues" type="text" maxlength="50" [(ngModel)]="currentOrder.statues" name="statues" />
    </div>
  </div>

  <div class="orders-detail">
    <h3>Order Items</h3>
    <table class="order-items-grid">
      <thead>
        <tr>
          <th>Item ID</th>
          <th>Product ID</th>
          <th>Quantity</th>
          <th>Unit Price</th>
          <th>Total Price</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of orderItems; let i = index; trackBy: trackByItem"
            [class.selected]="i === currentItemIndex"
            (click)="selectItem(i)">
          <td>
            <input type="text" [value]="item.itemId" readonly />
          </td>
          <td>
            <input type="number" [(ngModel)]="item.productIdFk" [name]="'productIdFk_' + i" />
          </td>
          <td>
            <input type="number" [(ngModel)]="item.quantity" [name]="'quantity_' + i"
                   (ngModelChange)="onValidateQuantity(item)" />
          </td>
          <td>
            <input type="number" step="0.01" [(ngModel)]="item.unitPrice" [name]="'unitPrice_' + i"
                   (ngModelChange)="onValidateQuantity(item)" />
          </td>
          <td>
            <input type="number" step="0.01" [value]="item.totalPrice" readonly />
          </td>
          <td>
            <button type="button" (click)="deleteItemRow(i); $event.stopPropagation()">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="detail-controls">
      <button type="button" (click)="createItemRecord()">Create Item</button>
      <button type="button" (click)="previousItemRecord()">Previous Item</button>
      <button type="button" (click)="nextItemRecord()">Next Item</button>
    </div>
  </div>

  <div class="record-navigation">
    <button type="button" (click)="firstRecord()">First</button>
    <button type="button" (click)="previousRecord()">Previous</button>
    <button type="button" (click)="nextRecord()">Next</button>
    <button type="button" (click)="lastRecord()">Last</button>
    <button type="button" (click)="createRecord()">New</button>
  </div>

  <div class="record-actions">
    <button type="button" (click)="saveForm()">Save</button>
    <button type="button" (click)="deleteRecord()">Delete</button>
    <button type="button" (click)="exitForm()">Exit</button>
  </div>

  <div class="form-messages" *ngIf="formMessage">
    {{ formMessage }}
  </div>
</div>
